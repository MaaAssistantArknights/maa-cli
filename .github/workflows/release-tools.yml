name: Test Release Tools

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/release-*.sh
      - .github/scripts/test-release-*.sh
      - .github/workflows/release.yml
      - .github/workflows/release-readiness.yml
      - .github/workflows/prepare-release.yml
      - .github/workflows/release-tools.yml
      - .github/workflows/publish-homebrew.yml
      - .github/workflows/publish-aur.yml
      - .github/workflows/publish-winget.yml
      - cliff.toml
      - xtask/src/release/**
      - xtask/src/github.rs

permissions:
  contents: read

jobs:
  test:
    name: Release Tool Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1
      - run: cargo build -p xtask --locked
      - run: cargo test -p xtask --locked
      - run: cargo clippy -p xtask --all-targets --locked -- -D warnings
      - run: bash .github/scripts/test-release-files.sh
      - run: bash .github/scripts/test-release-recovery.sh
