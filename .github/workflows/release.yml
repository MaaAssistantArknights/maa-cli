name: Release
on:
  push:
    tags:
      - "v*"
  # Just used for testing
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Whether to publish a new release
        default: false
        required: true
        type: boolean
  schedule:
    # Release nightly every day at 20:00 UTC (4:00 AM UTC+8)
    - cron: "0 20 * * *"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.pull_request.number) || 'release-state' }}
  queue: max

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  # Tag runs use the tagged tooling; Nightly uses the main commit that started the run.
  TOOLS_REF: ${{ github.sha }}

jobs:
  meta:
    name: Meta
    if: (github.event_name == 'push' && github.event.deleted == false) || github.event_name == 'pull_request' || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version || steps.nightly.outputs.version }}
      tag: ${{ steps.tag.outputs.tag || 'nightly' }}
      ref: ${{ steps.nightly.outputs.ref || github.sha }}
      channel: ${{ steps.tag.outputs.channel || 'nightly' }}
      profile: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && 'release-lto' || 'dev' }}
      publish: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      skip: ${{ steps.nightly.outputs.skip || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Read Release Tag
        id: tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Expected vX.Y.Z or vX.Y.Z-beta.N, got $RELEASE_TAG"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          source_version="$(awk -F'"' '/^version = /{print $2; exit}' crates/maa-cli/Cargo.toml)"
          if [[ "${version%-beta.*}" != "$source_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo.toml version $source_version"
            exit 1
          fi
          channel=stable
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            channel=beta
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare Nightly
        id: nightly
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip() {
            echo "$1"
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          }
          error() { echo "::error::$1"; exit 1; }

          commit="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            refs="$(git ls-remote --heads origin 'refs/heads/dev-*')"
            read -ra branches <<< "$(awk '{sub("refs/heads/", "", $2); print $2}' <<< "$refs" | tr '\n' ' ')"
            if (( ${#branches[@]} > 1 )); then
              error "Only one dev branch may exist, found: ${branches[*]}"
            elif (( ${#branches[@]} == 0 )); then
              skip "No dev branch; there is no nightly to release."
            fi
            git fetch --no-tags --depth=1 origin "+refs/heads/${branches[0]}:refs/remotes/origin/${branches[0]}"
            commit="$(git rev-parse "origin/${branches[0]}")"

            nightly="$(git ls-remote origin refs/tags/nightly 'refs/tags/nightly^{}' | tail -n1 | cut -f1)"
            if [[ "$nightly" == "$commit" ]] &&
               [[ "$(gh release view nightly --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
              skip 'Nightly already builds this commit.'
            fi
          fi
          version="$(git show "$commit:crates/maa-cli/Cargo.toml" | awk -F'"' '/^version = /{print $2; exit}')"
          version="$version-nightly.$(date +%s)+sha.$(git rev-parse --short "$commit")"
          echo "Release $version (nightly) from $commit"

          {
            echo 'skip=false'
            echo "version=$version"
            echo "ref=$commit"
          } >> "$GITHUB_OUTPUT"

  release-note:
    name: Generate Release Notes
    if: ${{ !fromJson(needs.meta.outputs.skip) }}
    runs-on: ubuntu-latest
    needs: [meta]
    env:
      CLIFF_SHORT_USERNAME: true
    outputs:
      content: ${{ steps.stable.outputs.content || steps.prerelease.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
          fetch-depth: ${{ needs.meta.outputs.channel == 'stable' && 1 || 0 }}
      - name: Read Stable Release Notes
        id: stable
        if: needs.meta.outputs.channel == 'stable'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          if ! grep -qxF "## Release $VERSION" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          notes="$(awk -v heading="## Release $VERSION" '/^## /{found = $0 == heading} found' CHANGELOG.md)"
          {
            echo 'content<<RELEASE_NOTES'
            printf '%s\n' "$notes"
            echo 'RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"
      - name: Generate Release Notes
        id: prerelease
        if: needs.meta.outputs.channel != 'stable'
        uses: orhun/git-cliff-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
        with:
          config: cliff.toml
          args: >-
            ${{ needs.meta.outputs.channel == 'beta' && '--latest --tag-pattern="^v"' || '--unreleased' }}
            --use-branch-tags --strip all

      - name: Preview Release Notes
        if: ${{ !fromJson(needs.meta.outputs.publish) }}
        env:
          NOTES: ${{ steps.stable.outputs.content || steps.prerelease.outputs.content }}
        run: |
          {
            echo '```markdown'
            printf '%s\n' "$NOTES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: meta
    if: ${{ !fromJson(needs.meta.outputs.skip) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
          - windows-11-arm
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.8.4
      - name: Build
        id: build
        env:
          MAA_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cargo x build --output-dir "$RUNNER_TEMP/maa-cli" --vendored-deps \
            --profile ${{ needs.meta.outputs.profile }}
      - name: Archive Build
        env:
          TARGET: ${{ steps.build.outputs.host_triplet }}
        run: tar -cf "$TARGET.tar" -C "$RUNNER_TEMP/maa-cli" .
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: maa_cli-${{ steps.build.outputs.host_triplet }}
          path: ${{ steps.build.outputs.host_triplet }}.tar
          retention-days: 1
          if-no-files-found: error

  release:
    name: Release
    if: ${{ !fromJson(needs.meta.outputs.skip) }}
    runs-on: ubuntu-latest
    needs: [meta, build, release-note]
    concurrency:
      group: release-${{ needs.meta.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      COMMIT: ${{ needs.meta.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TOOLS_REF }}
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: maa_cli-*
      - name: Package Release Artifacts
        run: cargo x package
      - name: Upload Release Manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          overwrite: true
          path: |
            manifest.json
            manifest.txt
          retention-days: 1
          if-no-files-found: error
      - name: Remove Previous Nightly Release
        if: ${{ fromJson(needs.meta.outputs.publish) && needs.meta.outputs.channel == 'nightly' }}
        run: |
          if gh release view nightly &> /dev/null; then
            echo "Release as nightly, clear existing release and tag"
            gh release delete nightly --yes --cleanup-tag
          fi
          sleep 5 # wait to avoid the release becomes draft
      - name: Create Draft Release
        if: ${{ fromJson(needs.meta.outputs.publish) }}
        env:
          PRERELEASE: ${{ needs.meta.outputs.channel != 'stable' }}
          RELEASE_NOTES: ${{ needs.release-note.outputs.content }}
        run: |
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [[ "$draft" == false ]]; then
            echo "::error::$TAG is already published. Re-run only the failed jobs: a full re-run rebuilds different binaries."
            exit 1
          fi
          printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          args=(--title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE")
          if [[ "$draft" == none ]]; then
            gh release create "$TAG" --target "$COMMIT" --draft "${args[@]}"
          else
            gh release edit "$TAG" --target "$COMMIT" --draft=true "${args[@]}"
          fi
          shopt -s failglob
          gh release upload "$TAG" --clobber \
            maa_cli-*-unknown-linux-gnu.tar.gz \
            maa_cli-*-apple-darwin.tar.gz \
            maa_cli-*-pc-windows-msvc.zip
      - name: Publish Release
        if: ${{ fromJson(needs.meta.outputs.publish) }}
        run: gh release edit "$TAG" --draft=false

  update-index:
    name: Update Version Index
    needs: [meta, release]
    if: ${{ fromJson(needs.meta.outputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.meta.outputs.channel }}
    steps:
      - name: Checkout Release Tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TOOLS_REF }}
      - name: Checkout version branch
        uses: actions/checkout@v7
        with:
          ref: version
          path: version
      - name: Download Release Manifest
        uses: actions/download-artifact@v8
        with:
          name: release-manifest
          path: release-manifest
      - name: Select Index Channels
        id: channels
        env:
          MANIFEST: release-manifest/manifest.json
          INDEX_DIR: version
        run: |
          channels="$(cargo x channel)"
          echo "channels=$channels" >> "$GITHUB_OUTPUT"
      - name: Update Version Files
        if: steps.channels.outputs.channels != ''
        env:
          UPDATE_CHANNELS: ${{ steps.channels.outputs.channels }}
        run: |
          read -ra channels <<< "$UPDATE_CHANNELS"
          for channel in "${channels[@]}"; do
            names=("$channel")
            if [[ "$channel" == nightly ]]; then names+=(alpha); fi
            for name in "${names[@]}"; do
              cp release-manifest/manifest.json "version/$name.json"
              cp release-manifest/manifest.txt "version/$name.txt"
            done
          done
      - name: Commit version files and Push
        if: steps.channels.outputs.channels != ''
        working-directory: version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Commit changes to version files"
            echo '```diff'
            git diff ./*.json ./*.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git add ./*.json ./*.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to v$VERSION"
            git push --verbose origin HEAD:refs/heads/version
          fi

  update-stable:
    name: Update Stable Tag
    if: ${{ fromJson(needs.meta.outputs.publish) && needs.meta.outputs.channel == 'stable' }}
    needs: [meta, release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.ref }}
      - name: Update Stable Tag
        run: |
          git tag -f stable ${{ needs.meta.outputs.ref }}
          git push --verbose --force origin stable

  publish-homebrew:
    name: Publish Homebrew Formulae
    needs: [meta, release]
    if: ${{ fromJson(needs.meta.outputs.publish) && needs.meta.outputs.channel != 'nightly' }}
    uses: ./.github/workflows/publish-homebrew.yml
    with:
      dryrun: false
    secrets:
      MAA_HOMEBREW_BUMP_PR: ${{ secrets.MAA_HOMEBREW_BUMP_PR }}

  publish-aur:
    name: Publish AUR Package
    needs: [meta, release]
    if: ${{ fromJson(needs.meta.outputs.publish) && needs.meta.outputs.channel == 'stable' }}
    uses: ./.github/workflows/publish-aur.yml
    with:
      pkgver: ${{ needs.meta.outputs.version }}
      dryrun: false
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  publish-winget:
    name: Publish Winget Package
    permissions:
      contents: write
    needs: [meta, release]
    if: ${{ fromJson(needs.meta.outputs.publish) && needs.meta.outputs.channel == 'stable' }}
    uses: ./.github/workflows/publish-winget.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      tag: ${{ needs.meta.outputs.tag }}
    secrets:
      MAABOT_WINGET_TOKEN: ${{ secrets.MAABOT_WINGET_TOKEN }}
