name: Release
on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      channel:
        description: The prerelease channel
        default: beta
        required: true
        type: choice
        options: [alpha, beta]
      version:
        description: 'Base version: auto, patch, minor, major, or X.Y.Z'
        default: auto
        type: string
      publish:
        description: Whether to publish a new release
        default: false
        required: true
        type: boolean
  schedule:
    - cron: "0 20 * * *"

defaults:
  run:
    shell: bash

# Publishing and preparation share a queue. Closed PRs that cannot publish
# get a throwaway group so they never wait behind a release build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && !(github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'release')) && format('release-skip-{0}', github.run_id) || 'release-state' }}
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  meta:
    name: Release Plan
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'release') &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      channel: ${{ steps.plan.outputs.channel }}
      profile: ${{ steps.plan.outputs.profile }}
      publish: ${{ steps.plan.outputs.publish }}
      skip: ${{ steps.plan.outputs.skip }}
      packaged: ${{ steps.saved.outputs.bundle }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Select source commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          # Stable always publishes from main; beta and nightly follow this branch.
          PRERELEASE_BRANCH: ${{ vars.PRERELEASE_BRANCH || 'main' }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              commit=$(jq -r '.pull_request.merge_commit_sha' "$GITHUB_EVENT_PATH")
              ;;
            schedule)
              # Scheduled runs always start on main; build the prerelease branch head.
              commit=$(gh api "repos/$GH_REPO/commits/$PRERELEASE_BRANCH" --jq .sha)
              ;;
            workflow_dispatch)
              if [[ "$SOURCE_REF" != "refs/heads/$PRERELEASE_BRANCH" ]]; then
                echo "Prereleases are published from $PRERELEASE_BRANCH, not $SOURCE_REF." >&2
                exit 1
              fi
              commit="$SOURCE_SHA"
              ;;
            *) exit 1 ;;
          esac
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.source.outputs.commit }}
      - name: Locate this run's frozen plan and bundle
        id: saved
        run: bash .github/scripts/release-artifacts.sh
      - name: Restore frozen plan
        if: steps.saved.outputs.plan == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan
      - name: Checkout version index
        if: steps.saved.outputs.plan != 'true'
        uses: actions/checkout@v7
        with:
          ref: version
          path: version
      - name: Install git-cliff
        if: steps.saved.outputs.plan != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1
      - name: Resolve plan once
        if: steps.saved.outputs.plan != 'true'
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
          EVENT_NAME: ${{ github.event_name }}
          CHANNEL_INPUT: ${{ inputs.channel }}
          VERSION_SELECTION: ${{ inputs.version || 'auto' }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-plan"
          case "$EVENT_NAME" in
            pull_request) channel=stable; publish=true ;;
            schedule) channel=alpha; publish=true ;;
            workflow_dispatch) channel="$CHANNEL_INPUT"; publish="$PUBLISH_INPUT" ;;
            *) exit 1 ;;
          esac
          args=(--channel "$channel" --commit "$COMMIT" --version "$VERSION_SELECTION")
          if [[ "$publish" == true ]]; then args+=(--publish); fi
          GITHUB_OUTPUT="$RUNNER_TEMP/release-plan/outputs" cargo x -- release meta "${args[@]}"
          if ! grep -qx 'skip=true' "$RUNNER_TEMP/release-plan/outputs"; then
            version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/release-plan/outputs")
            if [[ "$channel" == stable ]]; then
              # Check the actual merge once, before freezing anything or creating a tag.
              # Replays restore the frozen plan instead of running this check again.
              GITHUB_OUTPUT="$RUNNER_TEMP/candidate" cargo x -- release select-version
              PREVIOUS_TAG=$(sed -n 's/^previous_tag=//p' "$RUNNER_TEMP/candidate") \
                bash .github/scripts/release-files.sh check
              bash .github/scripts/release-files.sh notes "$version" > "$RUNNER_TEMP/release-plan/notes.md"
            else
              VERSION="$version" TAG="$(sed -n 's/^tag=//p' "$RUNNER_TEMP/release-plan/outputs")" \
                bash .github/scripts/release-files.sh prerelease-notes \
                > "$RUNNER_TEMP/release-plan/notes.md"
            fi
          fi
      - name: Freeze plan before any publication
        if: steps.saved.outputs.plan != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan
          retention-days: 90
          if-no-files-found: error
      - name: Output frozen plan
        id: plan
        run: cat "$RUNNER_TEMP/release-plan/outputs" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: meta
    if: needs.meta.outputs.skip != 'true' && needs.meta.outputs.packaged != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-15-intel
          - macos-latest
          - windows-11-arm
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.commit }}
      - name: Build
        id: build
        env:
          MAA_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cargo x build --tar --vendored-deps \
            --profile ${{ needs.meta.outputs.profile }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: maa_cli-${{ steps.build.outputs.host_triplet }}
          path: ${{ steps.build.outputs.host_triplet }}.tar
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  build-universal:
    name: Build Universal Binary
    if: needs.meta.outputs.skip != 'true' && needs.meta.outputs.packaged != 'true'
    runs-on: macos-latest
    needs: [meta, build]
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-apple-darwin"
      - name: Create universal binaries
        run: |
          for arch in x86_64 aarch64; do
            target="$arch-apple-darwin"
            dir="maa_cli-$target"
            tar -xvf "$dir/$target.tar" -C "$dir"
          done
          lipo -create -output maa maa_cli-x86_64-apple-darwin/maa maa_cli-aarch64-apple-darwin/maa
          tar -cvf "universal-apple-darwin.tar" maa
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: maa_cli-universal-apple-darwin
          path: universal-apple-darwin.tar
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  build-winget:
    name: Build for Winget
    needs: meta
    if: needs.meta.outputs.skip != 'true' && needs.meta.outputs.packaged != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-11-arm
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.commit }}
      - name: Build
        id: build
        env:
          MAA_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cargo x build --tar --vendored-deps \
            --profile ${{ needs.meta.outputs.profile }} \
            --rename maa-cli.exe -- \
            --no-default-features --features core_installer,git2
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: maa_cli-${{ steps.build.outputs.host_triplet }}-winget
          path: ${{ steps.build.outputs.host_triplet }}.tar
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [meta, build, build-universal, build-winget]
    if: >-
      !cancelled() && needs.meta.result == 'success' &&
      needs.meta.outputs.skip != 'true' &&
      (needs.meta.outputs.packaged == 'true' ||
       (needs.build.result == 'success' && needs.build-universal.result == 'success' &&
        needs.build-winget.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.meta.outputs.channel }}
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      COMMIT: ${{ needs.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.commit }}
      - uses: actions/checkout@v7
        with:
          ref: version
          path: version
      - name: Restore release plan
        uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan
      - name: Locate immutable bundle on every job attempt
        id: bundle
        run: bash .github/scripts/release-artifacts.sh
      - name: Restore packaged artifacts
        if: steps.bundle.outputs.bundle == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release-bundle
      - name: Download build artifacts
        if: steps.bundle.outputs.bundle != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: maa_cli-*
      - name: Install cargo-about
        if: steps.bundle.outputs.bundle != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Package artifacts
        if: steps.bundle.outputs.bundle != 'true'
        run: |
          cargo about generate about.hbs -o licenses.md
          cargo x -- release package
      - name: Freeze bundle before publication
        if: steps.bundle.outputs.bundle != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: release-bundle
          retention-days: 90
          if-no-files-found: error
      - name: Verify publication is not obsolete
        if: needs.meta.outputs.publish == 'true'
        run: cargo x -- release check-publication
      - name: Check existing tag
        if: needs.meta.outputs.publish == 'true'
        run: bash .github/scripts/release-tag.sh
      - name: Create or finish release with the same artifacts
        if: needs.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.meta.outputs.version }}
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ needs.meta.outputs.commit }}
          prerelease: ${{ needs.meta.outputs.channel != 'stable' }}
          body_path: ${{ runner.temp }}/release-plan/notes.md
          fail_on_unmatched_files: true
          files: |
            release-bundle/maa_cli-*-unknown-linux-gnu.tar.gz
            release-bundle/maa_cli-*-apple-darwin.tar.gz
            release-bundle/maa_cli-*-pc-windows-msvc.zip
            release-bundle/maa_cli-*-pc-windows-msvc-winget.zip
      - name: Preview
        if: needs.meta.outputs.publish != 'true'
        run: cat "$RUNNER_TEMP/release-plan/notes.md" >> "$GITHUB_STEP_SUMMARY"

  update-index:
    name: Update Version Index
    outputs:
      current: ${{ steps.current.outputs.current }}
    needs: [meta, release]
    if: >-
      !cancelled() && needs.release.result == 'success' &&
      needs.meta.outputs.publish == 'true' && needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.meta.outputs.channel }}
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      COMMIT: ${{ needs.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.commit }}
      - uses: actions/checkout@v7
        with:
          ref: version
          path: version
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release-bundle
      - name: Apply published manifests
        run: cargo x -- release index
      - name: Commit index
        working-directory: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./*.json ./*.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to v$VERSION"
            git push origin HEAD:refs/heads/version
          fi
      - name: Check whether this is still the current channel release
        id: current
        run: |
          current=$(jq --arg version "$VERSION" --arg commit "$COMMIT" \
            '.version == $version and .details.commit == $commit' "version/$CHANNEL.json")
          echo "current=$current" >> "$GITHUB_OUTPUT"

  update-stable:
    name: Update Stable Tag
    if: ${{ !cancelled() && needs.update-index.result == 'success' && needs.update-index.outputs.current == 'true' && needs.meta.outputs.publish == 'true' && needs.meta.outputs.channel == 'stable' }}
    needs: [meta, update-index]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.commit }}
      - uses: actions/checkout@v7
        with:
          ref: version
          path: version
      - name: Update Stable Tag
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          COMMIT: ${{ needs.meta.outputs.commit }}
        run: |
          if ! jq -e --arg version "$VERSION" --arg commit "$COMMIT" \
            '.version == $version and .details.commit == $commit' version/stable.json > /dev/null; then
            echo 'A newer stable release is indexed; leave the stable tag unchanged.'
            exit 0
          fi
          git tag -f stable ${{ needs.meta.outputs.commit }}
          git push --verbose --force origin stable

  publish-homebrew:
    name: Publish Homebrew Formulae
    needs: [meta, update-index]
    if: ${{ !cancelled() && needs.update-index.result == 'success' && needs.update-index.outputs.current == 'true' && needs.meta.outputs.publish == 'true' && needs.meta.outputs.channel == 'stable' }}
    uses: ./.github/workflows/publish-homebrew.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      commit: ${{ needs.meta.outputs.commit }}
      dryrun: false
    secrets:
      MAA_HOMEBREW_BUMP_PR: ${{ secrets.MAA_HOMEBREW_BUMP_PR }}

  publish-aur:
    name: Publish AUR Package
    needs: [meta, update-index]
    if: ${{ !cancelled() && needs.update-index.result == 'success' && needs.update-index.outputs.current == 'true' && needs.meta.outputs.publish == 'true' && needs.meta.outputs.channel == 'stable' }}
    uses: ./.github/workflows/publish-aur.yml
    with:
      pkgver: ${{ needs.meta.outputs.version }}
      commit: ${{ needs.meta.outputs.commit }}
      dryrun: false
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  publish-winget:
    name: Publish Winget Package
    needs: [meta, update-index]
    if: ${{ !cancelled() && needs.update-index.result == 'success' && needs.update-index.outputs.current == 'true' && needs.meta.outputs.publish == 'true' && needs.meta.outputs.channel == 'stable' }}
    uses: ./.github/workflows/publish-winget.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      commit: ${{ needs.meta.outputs.commit }}
      tag: ${{ needs.meta.outputs.tag }}
    secrets:
      MAABOT_WINGET_TOKEN: ${{ secrets.MAABOT_WINGET_TOKEN }}
