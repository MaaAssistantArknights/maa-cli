name: Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Just used for testing
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      channel:
        description: The release channel
        default: beta
        required: true
        type: choice
        options:
          - alpha
          - beta
          - stable
      publish:
        description: Whether to publish a new release
        default: false
        required: true
        type: boolean
  schedule:
    # Release alpha every day at 20:00 UTC (4:00 AM UTC+8)
    - cron: "0 20 * * *"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  meta:
    name: Meta
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      channel: ${{ steps.meta.outputs.channel }}
      profile: ${{ steps.meta.outputs.profile }}
      publish: ${{ steps.meta.outputs.publish }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout Version Branch
        uses: actions/checkout@v7
        with:
          ref: version
          path: version
      - name: Meta
        id: meta
        run: |
          cargo x -- release meta

  release-note:
    name: Generate Release Notes
    if: ${{ !fromJson(needs.meta.outputs.skip) }}
    runs-on: ubuntu-latest
    needs: [meta]
    env:
      CLIFF_SHORT_USERNAME: true
    outputs:
      content: ${{ steps.git_cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate Release Notes
        id: git_cliff
        uses: orhun/git-cliff-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
        with:
          config: cliff.toml
          # If the release is triggered by a tag, process commits starting
          # from the latest tag, otherwise tag will be create later, so use
          # unreleased commits
          args: >
            -v
            ${{ github.event_name == 'push' && '-l' || '-u' }}
            ${{ needs.meta.outputs.channel != 'stable' && '--tag-pattern="^v"' || '' }}

      - name: Preview Release Notes
        if: ${{ !fromJson(needs.meta.outputs.publish) }}
        run: |
          {
            echo '```markdown'
            cat '${{ steps.git_cliff.outputs.changelog }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: meta
    if: ${{ !fromJson(needs.meta.outputs.skip) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-15-intel
          - macos-latest
          - windows-11-arm
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        id: build
        env:
          MAA_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cargo x build --tar --vendored-deps \
            --profile ${{ needs.meta.outputs.profile }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: maa_cli-${{ steps.build.outputs.host_triplet }}
          path: ${{ steps.build.outputs.host_triplet }}.tar
          retention-days: 1
          if-no-files-found: error

  release:
    name: Release
    if: ${{ !fromJson(needs.meta.outputs.skip) }}
    runs-on: ubuntu-latest
    needs: [meta, build, release-note]
    concurrency:
      group: release-${{ needs.meta.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      COMMIT: ${{ needs.meta.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: maa_cli-*
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Generate Third-Party Licenses Information
        run: cargo about generate about.hbs -o licenses.md
      - name: Package Release Artifacts
        run: cargo x --release -- release package
      - name: Upload Release Manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          overwrite: true
          path: |
            manifest.json
            manifest.txt
          retention-days: 1
          if-no-files-found: error
      - name: Remove Previous Nightly Release
        if: ${{ fromJson(needs.meta.outputs.publish) }}
        run: |
          if [[ "$TAG" == nightly ]] && gh release view "$TAG" &> /dev/null; then
            echo "Release as nightly, clear existing release and tag"
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          sleep 5 # wait to avoid the release becomes draft
      - name: Create Draft Release
        if: ${{ fromJson(needs.meta.outputs.publish) }}
        env:
          PRERELEASE: ${{ needs.meta.outputs.channel != 'stable' }}
          RELEASE_NOTES: ${{ needs.release-note.outputs.content }}
        run: |
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          if [[ "$draft" == false ]]; then
            echo "::error::$TAG is already published. Re-run only the failed jobs: a full re-run rebuilds different binaries."
            exit 1
          fi
          printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          args=(--title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE")
          if [[ "$draft" == none ]]; then
            gh release create "$TAG" --target "$COMMIT" --draft "${args[@]}"
          else
            gh release edit "$TAG" --target "$COMMIT" --draft=true "${args[@]}"
          fi
          shopt -s failglob
          gh release upload "$TAG" --clobber \
            maa_cli-*-unknown-linux-gnu.tar.gz \
            maa_cli-*-apple-darwin.tar.gz \
            maa_cli-*-pc-windows-msvc.zip
      - name: Publish Release
        if: ${{ fromJson(needs.meta.outputs.publish) }}
        run: gh release edit "$TAG" --draft=false

  update-index:
    name: Update Version Index
    needs: [meta, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.meta.outputs.channel }}
    steps:
      - name: Checkout version branch
        uses: actions/checkout@v7
        with:
          ref: version
          path: version
      - name: Download Release Manifest
        uses: actions/download-artifact@v8
        with:
          name: release-manifest
          path: release-manifest
      - name: Update Version Files
        run: |
          case "$CHANNEL" in
            stable) channels=(stable beta alpha) ;;
            beta) channels=(beta alpha) ;;
            alpha) channels=(alpha) ;;
            *) echo "Unknown channel: $CHANNEL" >&2; exit 1 ;;
          esac
          for channel in "${channels[@]}"; do
            cp release-manifest/manifest.json "version/$channel.json"
            cp release-manifest/manifest.txt "version/$channel.txt"
          done
      - name: Commit version files and Push
        working-directory: version
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Commit changes to version files"
            echo '```diff'
            git diff ./*.json ./*.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git commit ./*.json ./*.txt -m 'chore: bump version to v${{ needs.meta.outputs.version }}'
          git push --verbose ${{ !fromJson(needs.meta.outputs.publish) && '--dry-run' || ''}}

  update-stable:
    name: Update Stable Tag
    if: ${{ fromJson(needs.meta.outputs.publish) && needs.meta.outputs.channel == 'stable' }}
    needs: [meta, release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.commit }}
      - name: Update Stable Tag
        run: |
          git tag -f stable ${{ needs.meta.outputs.commit }}
          git push --verbose --force origin stable

  update-changelog:
    name: Update Changelog
    needs: [meta, release]
    permissions:
      contents: write
    if: ${{ fromJson(needs.meta.outputs.publish) && needs.meta.outputs.channel == 'stable' }}
    uses: ./.github/workflows/publish-changelog.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      dryrun: false

  publish-homebrew:
    name: Publish Homebrew Formulae
    needs: [meta, release]
    if: ${{ fromJson(needs.meta.outputs.publish) && needs.meta.outputs.channel == 'stable' }}
    uses: ./.github/workflows/publish-homebrew.yml
    with:
      dryrun: false
    secrets:
      MAA_HOMEBREW_BUMP_PR: ${{ secrets.MAA_HOMEBREW_BUMP_PR }}

  publish-aur:
    name: Publish AUR Package
    needs: [meta, release]
    if: ${{ fromJson(needs.meta.outputs.publish) && needs.meta.outputs.channel == 'stable' }}
    uses: ./.github/workflows/publish-aur.yml
    with:
      pkgver: ${{ needs.meta.outputs.version }}
      dryrun: false
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  publish-winget:
    name: Publish Winget Package
    permissions:
      contents: write
    needs: [meta, release]
    if: ${{ fromJson(needs.meta.outputs.publish) && needs.meta.outputs.channel == 'stable' }}
    uses: ./.github/workflows/publish-winget.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      tag: ${{ needs.meta.outputs.tag }}
    secrets:
      MAABOT_WINGET_TOKEN: ${{ secrets.MAABOT_WINGET_TOKEN }}
