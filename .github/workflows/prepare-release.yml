name: Prepare Stable Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'main for a small release, or the dev-X.Y branch to merge back'
        type: string
        default: main
      version:
        description: 'auto, patch, minor, major, or an exact stable version (main only)'
        type: string
        default: auto

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-state
  queue: max

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare Stable Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ inputs.branch }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Checkout dev branch
        if: inputs.branch != 'main'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}
          path: source

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1

      - name: Prepare release files
        id: release
        env:
          VERSION_SELECTION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          source=.
          if [[ "$BRANCH" != main ]]; then source=source; fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          cargo x -- release prepare --source "$source" --branch "$BRANCH" \
            --version "$VERSION_SELECTION"

      - name: Commit release preparation as GitHub Actions
        working-directory: ${{ steps.release.outputs.source }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Cargo.lock crates/maa-cli/Cargo.toml
          git commit -m "chore(release): prepare for v$VERSION"

      - name: Push and create or update the release pull request
        working-directory: ${{ steps.release.outputs.source }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$BRANCH" == main ]]; then
            # A small release: a release-prep branch with only the release files.
            head="release-prep/v$VERSION"
            remote_head="$(git ls-remote --heads origin "refs/heads/$head" | cut -f1)"
            if [[ -n "$remote_head" ]]; then
              git push origin \
                --force-with-lease="refs/heads/$head:$remote_head" \
                "HEAD:refs/heads/$head"
            else
              git push origin "HEAD:refs/heads/$head"
            fi
            title="chore(release): prepare for v$VERSION"
          else
            # A dev branch merges back as the release: add the changelog to it directly.
            head="$BRANCH"
            git push origin "HEAD:refs/heads/$head"
            title="chore(release): v$VERSION"
          fi

          body="$RUNNER_TEMP/release-pr-body.md"
          {
            echo "Release **v$VERSION** from \`$head\`."
            echo
            echo '- Version and changelog prepared from the exact candidate commit'
            echo '- The release label makes merging this PR into main publish Stable'
            if [[ "$BRANCH" != main ]]; then
              echo '- Merge with a merge commit, never squash or rebase, so beta tags stay in history'
            fi
            echo
            echo 'Approve its workflows, and run Prepare again if main changes before merging.'
          } > "$body"

          if ! gh label list --json name --jq '.[].name' | grep -qx release; then
            gh label create release --description 'Merging this PR publishes a stable release'
          fi
          pr_url="$(gh pr list --base main --head "$head" --state open \
            --json url --jq '.[0].url')"
          if [[ -n "$pr_url" ]]; then
            gh pr edit "$pr_url" --title "$title" --body-file "$body" --add-label release
          else
            gh pr create --base main --head "$head" --title "$title" \
              --body-file "$body" --label release
          fi

          # A newer preparation supersedes older release-prep PRs.
          gh pr list --base main --state open --json number,headRefName,isCrossRepository \
            --jq ".[] | select(.isCrossRepository | not)
                      | select(.headRefName | startswith(\"release-prep/\"))
                      | select(.headRefName != \"$head\") | .number" |
            while IFS= read -r number; do
              gh pr close "$number" --delete-branch \
                --comment "Superseded by the v$VERSION release preparation."
            done
