name: Publish Homebrew

on:
  workflow_call:
    inputs:
      dryrun:
        description: Do not create PR
        required: true
        type: boolean
    secrets:
      MAA_HOMEBREW_BUMP_PR:
        description: GitHub PAT for creating PR
        required: true
  workflow_dispatch:
    inputs:
      dryrun:
        description: Do not create PR
        default: true
        required: true
        type: boolean

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.MAA_HOMEBREW_BUMP_PR }}

jobs:
  bump:
    name: Bump Formulae and Casks
    runs-on: macos-latest
    steps:
      - name: Tap MaasistantArknights Tap
        run: brew tap MaaAssistantArknights/homebrew-tap
      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump Formulae and Casks
        env:
          DRYRUN: ${{ inputs.dryrun }}
        run: |
          # Each formula's livecheck picks its version: maa-cli follows stable tags,
          # maa-cli-beta also follows beta and rc tags. Up-to-date formulae are skipped.
          args=(--no-fork --formula maaassistantarknights/tap/maa-cli maaassistantarknights/tap/maa-cli-beta)
          if [[ "$DRYRUN" != true ]]; then args+=(--open-pr); fi
          brew bump "${args[@]}"
