name: Publish Homebrew

on:
  workflow_call:
    inputs:
      commit:
        description: Expected stable release commit
        required: true
        type: string
      version:
        description: Package version
        required: true
        type: string
      dryrun:
        description: Do not create PR
        required: true
        type: boolean
    secrets:
      MAA_HOMEBREW_BUMP_PR:
        description: GitHub PAT for creating PR
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        type: string
      dryrun:
        description: Do not create PR
        default: true
        required: true
        type: boolean

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.MAA_HOMEBREW_BUMP_PR }}

jobs:
  bump:
    name: Bump Formulae and Casks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tap MaasistantArknights Tap
        run: brew tap MaaAssistantArknights/homebrew-tap
      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify current stable release
        if: ${{ !inputs.dryrun }}
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-current.sh
      - name: Bump Formulae and Casks
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for formula in maa-cli maa-cli-beta; do
            current=$(brew info --json=v2 "$formula" | jq -r '.formulae[0].versions.stable')
            if [[ "$formula" == maa-cli-beta ]] &&
              ! bash .github/scripts/release-is-newer.sh "$VERSION" "$current"; then
              echo "Keeping $formula at newer prerelease $current"
              continue
            fi
            brew bump-formula-pr "$formula" \
              ${{ inputs.dryrun && '--dry-run' || '' }} \
              --no-browse \
              --version='${{ inputs.version }}'
          done
