name: Publish Homebrew

on:
  workflow_call:
    inputs:
      version:
        description: Package version
        required: true
        type: string
      formulae:
        description: Space-separated formulae to bump
        required: true
        type: string
      dryrun:
        description: Do not create PR
        required: true
        type: boolean
    secrets:
      MAA_HOMEBREW_BUMP_PR:
        description: GitHub PAT for creating PR
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        type: string
      formulae:
        description: Space-separated formulae to bump (maa-cli, maa-cli-beta)
        default: maa-cli
        required: true
        type: string
      dryrun:
        description: Do not create PR
        default: true
        required: true
        type: boolean

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.MAA_HOMEBREW_BUMP_PR }}

jobs:
  bump:
    name: Bump Formulae and Casks
    runs-on: macos-latest
    steps:
      - name: Tap MaasistantArknights Tap
        run: brew tap MaaAssistantArknights/homebrew-tap
      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump Formulae and Casks
        env:
          VERSION: ${{ inputs.version }}
          FORMULAE: ${{ inputs.formulae }}
          DRYRUN: ${{ inputs.dryrun }}
        run: |
          # The release plan only lists formulae whose channel this release updates.
          read -ra formulae <<< "$FORMULAE"
          for formula in "${formulae[@]}"; do
            args=(--no-browse "--version=$VERSION")
            if [[ "$DRYRUN" == true ]]; then args+=(--dry-run); fi
            brew bump-formula-pr "$formula" "${args[@]}"
          done
